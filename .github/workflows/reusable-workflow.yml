name: Testing - Reusable Workflow
on: 
  workflow_call:
    inputs:
      APP_INGRESS_URL:
        required: true
        type: string
    secrets:
      MONGO_URI:
        required: true
      MONGO_USERNAME:
        required: true
      MONGO_PASSWORD:
        required: true
jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: '${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}'
        run: |
          curl https://$URL/live -s -k | jq -r .status | grep -i live